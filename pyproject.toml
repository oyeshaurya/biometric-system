[project]
name = "biometric-lab"
version = "0.1.0"
description = "Face-Recognition Performance Lab: a local tool for measuring face-verification performance (FAR, FRR, GAR, EER)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Shaurya Verma" }]

dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "sqlalchemy>=2.0,<3.0",
    "alembic>=1.13,<2.0",
    "pydantic>=2.7,<3.0",
    "pydantic-settings>=2.3,<3.0",
    "cryptography>=42.0",
    "argon2-cffi>=23.1",
    "numpy>=1.26",
    "python-multipart>=0.0.9",
    "itsdangerous>=2.2",
]

[project.optional-dependencies]
# Real face engine. Optional so the test suite and core install work without it.
engine = [
    "opencv-python-headless>=4.9",
    "onnxruntime>=1.17",
    "insightface>=0.7.3",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "ruff>=0.5",
    "mypy>=1.10",
    "hypothesis>=6.100",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "model: tests that require the real face model (deselect with -m 'not model')",
]
addopts = "-m 'not model'"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]

[tool.mypy]
python_version = "3.11"
packages = ["biometric_lab"]
ignore_missing_imports = true
